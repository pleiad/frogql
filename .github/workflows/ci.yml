name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  check:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D clippy::all

  test:
    name: cargo test
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # bench_test has pre-existing failures — exclude it (see CLAUDE.md).
      # All other integration test binaries are listed explicitly so a
      # newly-added file isn't silently skipped from CI.
      - name: Run tests
        run: |
          cargo test --test parser_test \
                     --test runtime_test \
                     --test store_runtime_test \
                     --test text2gql_test \
                     --test typecheck_test \
                     --test typecheck_smoke \
                     --test elaborate_test \
                     --test float_test \
                     --test list_test \
                     --test record_test \
                     --test count_test \
                     --test parse_and_run_test
