name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  clippy:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D clippy::all

  test:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Lib unit tests (inline `#[cfg(test)] mod tests` in src/).
      - name: Lib tests
        run: cargo test --workspace --lib
      # Every integration test is a module of the one `it` binary
      # (`tests/it/main.rs`), so nothing needs discovering: a new file is
      # in the run once it has its `mod` line. `bench_test` stays out
      # (pre-existing failures — see CLAUDE.md); it is the one target
      # left directly under `tests/`.
      - name: Integration tests
        run: cargo test --test it

  # Compiling for wasm32 proves nothing about running there: the target
  # has no filesystem and no clock, and `SystemTime::now()` /
  # `Instant::now()` *panic* rather than degrade — a wasm panic unwinds as
  # `RuntimeError: unreachable`, so the call never returns. 0.5.3 shipped
  # an `open_json` that failed on every input, the README's one-node
  # example included, because a diagnostic timer landed on the
  # index-build path the browser backend takes. This job runs the
  # published surface under Node so that class of break is caught before
  # the release job publishes it.
  wasm-smoke:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install wasm-pack
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
      # `--target nodejs` so plain `require` works; the published package
      # uses `--target web`, and the two differ only in the JS shim, not
      # in the wasm the engine compiles to.
      - name: Build frogql-wasm for Node
        run: wasm-pack build wasm --target nodejs --out-dir ../pkg-smoke
      - name: Smoke test
        run: node wasm/smoke/smoke.cjs
      # `frogql --serve` compiles `explorer/embed/` into the binary, so a
      # stale copy ships an explorer that does not match the engine beside
      # it. The generated JS shim is derived from the binding's surface, so
      # a method added to `wasm/src/lib.rs` without a refresh shows up here
      # as a diff. It does not catch a pure-internals change — for that the
      # discipline is the release ritual, the same one `node/index.js` has.
      - name: The embedded wasm is current
        run: |
          wasm-pack build wasm --target web --out-dir ../explorer/pkg
          if ! diff -q explorer/pkg/frogql_wasm.js explorer/embed/frogql_wasm.js; then
            echo "::error::explorer/embed/ is stale. Run: just embed-wasm"
            diff explorer/pkg/frogql_wasm.js explorer/embed/frogql_wasm.js | head -40
            exit 1
          fi
