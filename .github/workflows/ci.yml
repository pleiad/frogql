name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  clippy:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D clippy::all

  test:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Lib unit tests (inline `#[cfg(test)] mod tests` in src/).
      - name: Lib tests
        run: cargo test --workspace --lib
      # Auto-discover every integration test under `tests/` and exclude
      # `bench_test` (pre-existing failures — see CLAUDE.md). New test
      # files are picked up automatically the moment they land; the
      # previous manual --test allowlist had drifted out of sync with
      # the repo (42 of 57 test files were silently skipped at the
      # time this auto-discovery shim was introduced).
      - name: Integration tests
        run: |
          TESTS=$(ls tests/*.rs | xargs -n1 basename | sed 's/\.rs$//' \
                  | grep -v '^bench_test$' \
                  | awk '{print "--test " $0}' | tr '\n' ' ')
          echo "Running $(echo "$TESTS" | wc -w | awk '{print $1/2}') integration test binaries"
          cargo test $TESTS
