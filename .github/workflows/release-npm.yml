name: Release npm

# Build per-platform .node binaries and publish to npm when a tag like
# v0.2.0 or v0.2.0-rc.1 is pushed. Mirrors `release.yml` (PyPI) so a
# single tag fires both: PyPI workflow + this one.
#
# Setup: a repo secret named `NPM_TOKEN` (npm Automation token) must
# exist. Never commit the value.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  APP_NAME: frogql
  NAPI_WORKDIR: node

jobs:
  build:
    name: Build ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          # x86_64-apple-darwin cross-compiles from the macos-14 (arm64)
          # runner. macos-13 (Intel) has multi-hour queues as GitHub
          # winds it down. Apple Silicon includes the x86_64 toolchain
          # natively so no zig / cross-cc needed.
          - host: macos-14
            target: x86_64-apple-darwin
            build: npx napi build --platform --release --target x86_64-apple-darwin
          - host: macos-14
            target: aarch64-apple-darwin
            build: npx napi build --platform --release --target aarch64-apple-darwin
          - host: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            # x86_64 linux is native on ubuntu-22.04 runner — no cross.
            build: npx napi build --platform --release --target x86_64-unknown-linux-gnu
          - host: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            # aarch64 linux needs cross-compile. napi-cli v2 ships `--zig`
            # for zig-as-cc which avoids needing the gcc-aarch64 toolchain.
            build: npx napi build --platform --release --target aarch64-unknown-linux-gnu --zig
          - host: windows-2022
            target: x86_64-pc-windows-msvc
            build: npx napi build --platform --release --target x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          check-latest: true
          cache: npm
          cache-dependency-path: node/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      # Only the aarch64-linux job needs zig as cross-cc. Other matrix
      # cells build natively on their host.
      - name: Setup Zig (aarch64 linux cross)
        if: matrix.settings.target == 'aarch64-unknown-linux-gnu'
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.11.0

      - name: Install dependencies
        working-directory: ${{ env.NAPI_WORKDIR }}
        # `npm install`, not `ci`. The host's `optionalDependencies`
        # reference the 5 platform sub-packages this very workflow
        # publishes. `npm ci` strict-mode rejects a lock file that
        # doesn't list packages npm can now resolve from the registry,
        # and we can't keep the lock in sync with the chicken-and-egg
        # of self-publishing optionalDependencies. `npm install` is
        # forgiving and only needs the devDependencies (napi-cli, tsc).
        run: npm install --no-audit --no-fund

      - name: Build
        working-directory: ${{ env.NAPI_WORKDIR }}
        run: ${{ matrix.settings.build }}
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: ${{ env.NAPI_WORKDIR }}/${{ env.APP_NAME }}.*.node
          if-no-files-found: error

  publish:
    name: Publish to npm
    runs-on: ubuntu-22.04
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          check-latest: true
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: node/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.NAPI_WORKDIR }}
        # `npm install`, not `ci`. The host's `optionalDependencies`
        # reference the 5 platform sub-packages this very workflow
        # publishes. `npm ci` strict-mode rejects a lock file that
        # doesn't list packages npm can now resolve from the registry,
        # and we can't keep the lock in sync with the chicken-and-egg
        # of self-publishing optionalDependencies. `npm install` is
        # forgiving and only needs the devDependencies (napi-cli, tsc).
        run: npm install --no-audit --no-fund

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ env.NAPI_WORKDIR }}/artifacts

      # napi-cli v2 needs the per-target dirs (`npm/<triple>/`) populated
      # with their own package.json before `napi artifacts` can move the
      # .node files in. `create-npm-dir` reads `napi.triples.additional`
      # from package.json and scaffolds each subdir.
      - name: Create per-platform npm dirs
        working-directory: ${{ env.NAPI_WORKDIR }}
        run: npx napi create-npm-dir -t .

      - name: Move artifacts to npm/<target>/ subdirs
        working-directory: ${{ env.NAPI_WORKDIR }}
        run: npx napi artifacts

      - name: List packages to publish
        working-directory: ${{ env.NAPI_WORKDIR }}
        run: ls -R ./npm

      - name: Set npm dist-tag based on version
        id: dist
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [[ "$VERSION" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
          echo "Publishing $VERSION → dist-tag=$(grep tag= "$GITHUB_OUTPUT" | cut -d= -f2)"

      - name: Publish platform packages + host
        working-directory: ${{ env.NAPI_WORKDIR }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
          DIST_TAG: ${{ steps.dist.outputs.tag }}
        run: |
          npm config set "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}"

          # Helper: skip if version already exists, soft-fail on spam
          # detector (npm flags new platform packages occasionally and
          # support has to whitelist them — block host publish on that).
          publish_if_new() {
            local dir="$1"
            local name version
            name=$(node -p "require('./${dir}/package.json').name")
            version=$(node -p "require('./${dir}/package.json').version")
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "::notice::${name}@${version} already on npm — skipping"
              return 0
            fi
            # `--ignore-scripts`: defensive. Platform sub-packages don't
            # have any lifecycle hooks today, but `--ignore-scripts`
            # makes that explicit and shields against future surprises.
            (cd "${dir}" && npm publish --tag "${DIST_TAG}" --access public --provenance --ignore-scripts) || {
              echo "::warning::publish failed for ${name}@${version} (continuing)"
              FAILED_PLATFORM_PUBLISHES="${FAILED_PLATFORM_PUBLISHES} ${name}"
              return 1
            }
          }

          FAILED_PLATFORM_PUBLISHES=""
          for pkg in npm/*/; do
            echo "::group::${pkg}"
            publish_if_new "${pkg%/}" || true
            echo "::endgroup::"
          done

          if [ -n "${FAILED_PLATFORM_PUBLISHES}" ]; then
            echo "::warning::Failed platform packages:${FAILED_PLATFORM_PUBLISHES}"
            echo "::warning::Host publish proceeds anyway; consumers on those platforms get a 'No native build' install error until the missing packages land."
          fi

          # Host package goes last so its optionalDependencies resolve
          # for consumers that hit a supported platform.
          host_name=$(node -p "require('./package.json').name")
          host_version=$(node -p "require('./package.json').version")
          if npm view "${host_name}@${host_version}" version >/dev/null 2>&1; then
            echo "::notice::${host_name}@${host_version} already on npm — skipping"
          else
            echo "::group::${host_name}@${host_version}"
            # `--ignore-scripts` is essential here: a `prepublishOnly`
            # hook would invoke `napi prepublish` which tries to
            # re-publish every platform sub-package and crashes the
            # workflow once any one of them is already on npm.
            npm publish --tag "${DIST_TAG}" --access public --provenance --ignore-scripts
            echo "::endgroup::"
          fi
