[package]
name = "gqlrust"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rustyline = "15"
# sysinfo: cross-platform RSS reading for the LDBC bench's
# Memory vs Lazy vs Disk RAM-cost comparison. Used only by
# `src/bin/ldbc_bench.rs`; cheap to compile.
sysinfo = "0.30"

[workspace]
members = [".", "python"]
