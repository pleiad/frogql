[package]
name = "frogql"
version = "0.5.7"
edition = "2021"
# MSRV of the engine library (default-features = false). Verified by
# building `--lib --no-default-features` on 1.71.0. Clippy reads this and
# will not suggest newer std APIs (e.g. `div_ceil` 1.73, `is_none_or`
# 1.82), which are open-coded at their call sites to hold this floor.
# The optional `repl`/`bench` binaries pull third-party deps that
# currently require a newer stable.
rust-version = "1.71"
description = "Embedded GQL graph database and query engine"
license = "MIT"
repository = "https://github.com/pleiad/frogql"
readme = "README.md"
# Whitelist what ships to crates.io. Without this the published tarball
# pulls in the committed examples/*.gdb databases (~297 MiB) and blows
# past the 10 MiB compressed package limit. Downstream only builds the
# library + bins, so tests/, bench/, and examples/ are not shipped.
include = [
    "/src/**/*.rs",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
    # `--serve` compiles the explorer's page and worker into the binary
    # with `include_str!`, so they have to travel with the crate. Left out,
    # the packaged crate does not build at all — `cargo publish` failed on
    # 0.5.6 with "couldn't read .../wasm/explorer/index.html", and nothing
    # before `cargo publish` looks: a normal `cargo build` reads them from
    # the working tree, where they are always present.
    #
    # `cargo package --list` is the check that would have caught it, and it
    # is cheap. Run it when adding an `include_str!` / `include_bytes!` of
    # anything outside `/src`.
    #
    # The page lives at `/explorer`, not under `/wasm`, for a reason no
    # `include` line can work around: `wasm/` is a workspace member, and
    # cargo excludes a nested package's directory from its parent's
    # archive whatever the whitelist says. It only ever *used* the wasm
    # crate's output; it was never part of it.
    "/explorer/index.html",
    "/explorer/worker.js",
]

# What `dist` ships in the CLI release archives. Only the REPL binary is
# user-facing; the bench/dev bins stay out. `bench` is off for the same
# reason the Python crate turns it off — it pulls ureq → ring, which does
# not cross-compile to aarch64-linux.
[package.metadata.dist]
default-features = false
features = ["repl"]

[package.metadata.dist.binaries]
"*" = ["frogql"]

[features]
# Defaults keep `cargo build` and CI behaviour identical to before.
# The Python crate (`python/`) opts out via `default-features = false`
# so the wheel doesn't drag in REPL / bench dependencies (notably
# `ring` via `ureq`, which fails to cross-compile on manylinux2014).
default = ["repl", "bench"]
repl = ["dep:rustyline", "dep:signal-hook"]
bench = ["dep:sysinfo", "dep:toml", "dep:ureq", "dep:zstd", "dep:tar", "dep:sha2"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser's clock. `wasm32-unknown-unknown` has no time source in std:
# `SystemTime::now()` there panics ("time not implemented on this
# platform"), which is how `DATE()` / `LOCAL_DATETIME()` took the whole
# module down instead of returning a date. `js-sys` is target-gated, so no
# native, Python or Node build ever sees it, and the browser gets the real
# answer rather than an error.
js-sys = "0.3"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
rustyline = { version = "15", optional = true }
# REPL only: Ctrl-C has to stop the running query without taking the
# process with it, and std has no signal API. Gated behind `repl` so the
# Python/Node/WASM builds never see it.
signal-hook = { version = "0.3", optional = true }
# sysinfo: cross-platform RSS reading for the LDBC bench's
# Memory vs Lazy vs Disk RAM-cost comparison.
sysinfo = { version = "0.30", optional = true }
# toml: per-IC query definitions in `bench/ldbc-queries/`.
# Multiline strings in TOML are nicer than JSON for spec-quoted
# query text. Used only by `src/bin/ldbc_bench.rs`.
toml = { version = "0.8", optional = true }
# Used by `src/bin/bench_setup.rs` to download + extract the LDBC
# dataset and substitution-params archives. ureq is a small blocking
# HTTP client (no async, no executor); zstd + tar handle the
# `.tar.zst` archives LDBC ships.
ureq = { version = "2.12", default-features = false, features = ["tls"], optional = true }
zstd = { version = "0.13", optional = true }
tar = { version = "0.4", optional = true }
# sha2: per-row content hashing in `ldbc_bench` so the cross-system
# bench can verify row-content equivalence across systems (with
# ORDER BY in every IC's toml, results are deterministic).
sha2 = { version = "0.10", optional = true }

[dev-dependencies]
proptest = "1"

# Bins that need optional deps. Auto-discovery still picks up the
# remaining bins (bench_queries, bench_repeat, convert_edgelist,
# dml_bench, orderby_bench, ltj_index_stats, pattern_typecheck) which
# use only the always-on dependencies.
[[bin]]
name = "frogql"
path = "src/bin/frogql.rs"
required-features = ["repl"]

[[bin]]
name = "bench_setup"
path = "src/bin/bench_setup.rs"
required-features = ["bench"]

[[bin]]
name = "ldbc_bench"
path = "src/bin/ldbc_bench.rs"
required-features = ["bench"]

# Also uses sysinfo. Auto-discovery left it ungated, which only showed up
# once the CLI release started building --no-default-features --features repl.
[[bin]]
name = "internal_bench"
path = "src/bin/internal_bench.rs"
required-features = ["bench"]

[workspace]
members = [".", "python", "node", "wasm"]
# resolver = "2" computes features per-target instead of unifying them
# globally across the workspace. Without it, building the python crate
# with --target X drags in frogql's default features (repl, bench)
# even though python/Cargo.toml sets default-features = false on
# frogql — which pulls ring (via ureq) and breaks aarch64
# cross-builds inside the manylinux2014 container.
resolver = "2"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
