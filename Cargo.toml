[package]
name = "gqlrust"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rustyline = "15"
# sysinfo: cross-platform RSS reading for the LDBC bench's
# Memory vs Lazy vs Disk RAM-cost comparison.
sysinfo = "0.30"
# toml: per-IC query definitions in `bench/ldbc-queries/`.
# Multiline strings in TOML are nicer than JSON for spec-quoted
# query text. Used only by `src/bin/ldbc_bench.rs`.
toml = "0.8"
# Used by `src/bin/bench_setup.rs` to download + extract the LDBC
# dataset and substitution-params archives. ureq is a small blocking
# HTTP client (no async, no executor); zstd + tar handle the
# `.tar.zst` archives LDBC ships.
ureq = { version = "2.12", default-features = false, features = ["tls"] }
zstd = "0.13"
tar = "0.4"

[dev-dependencies]
proptest = "1"
# criterion: statistically rigorous benchmark harness for the
# microsecond-scale typechecker phases. The hand-rolled CSV bench
# in `src/bin/typecheck_bench.rs` complements this — it's better
# at multi-DB sweeps and emitting raw per-iter CSV; criterion is
# better at confidence intervals, outlier detection, and
# regression checks against a saved baseline. Both stay.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "typecheck"
harness = false

[workspace]
members = [".", "python"]
