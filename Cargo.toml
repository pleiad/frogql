[package]
name = "gqlrust"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
rustyline = "15"
# sysinfo: cross-platform RSS reading for the LDBC bench's
# Memory vs Lazy vs Disk RAM-cost comparison.
sysinfo = "0.30"
# toml: per-IC query definitions in `bench/ldbc-queries/`.
# Multiline strings in TOML are nicer than JSON for spec-quoted
# query text. Used only by `src/bin/ldbc_bench.rs`.
toml = "0.8"
# Used by `src/bin/bench_setup.rs` to download + extract the LDBC
# dataset and substitution-params archives. ureq is a small blocking
# HTTP client (no async, no executor); zstd + tar handle the
# `.tar.zst` archives LDBC ships.
ureq = { version = "2.12", default-features = false, features = ["tls"] }
zstd = "0.13"
tar = "0.4"

[dev-dependencies]
proptest = "1"

[workspace]
members = [".", "python"]
