-- GQL translation of bench/ldbc-queries/ic8.toml for Grafeo.
-- Divergences (see DIVERGENCES.md): $-params; the anonymous
-- (:Comment|Post) message node becomes a bound var with a WHERE
-- label predicate (Grafeo rejects pattern label alternation).
MATCH (start:Person {id: $personId})<-[:hasCreator]-(msg)<-[:replyOf]-(comment:Comment)-[:hasCreator]->(person:Person)
WHERE msg:Comment OR msg:Post
RETURN
    person.id AS personId,
    person.firstName AS personFirstName,
    person.lastName AS personLastName,
    comment.creationDate AS commentCreationDate,
    comment.id AS commentId,
    comment.content AS commentContent
ORDER BY commentCreationDate DESC, commentId ASC
LIMIT 20
