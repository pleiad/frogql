// BLOCKED at MillenniumDB d67f3e7: runs (1.5-6 s a row) but answers a
// different question. MillenniumDB returns each endpoint of `{1, 2}` once,
// even under an explicit `ALL WALK`; ISO (and froGQL) return one row per
// walk. From person 32985348834013: 451 rows against froGQL's 658. The
// post counts below come out lower for every parameter row (15/15 differ).
//
// IC6 — tag co-occurrence. Translation of bench/ldbc-queries/ic6.toml.
// Divergences:
//  - Written as one chain starting from the tag, ending in the knows
//    repetition. The toml's form joins `(otherPerson)<-[:hasCreator]-(post)`
//    onto an otherPerson bound by `~[:knows]~{1,2}`, and MillenniumDB drops
//    a join whose shared variable is the TARGET of the later edge: it
//    returns a cross product (see DIVERGENCES.md). The reversed chain
//    describes the same walks, so the bag of rows and every count is equal.
//  - GROUP BY / ORDER BY name the alias `tagName`.
MATCH (tag:Tag {name: $tagName})<-[:hasTag]-(post:Post)-[:hasCreator]->(otherPerson:Person)~[:knows]~{1, 2}(person:Person {id: $personId}),
      (post)-[:hasTag]->(otherTag:Tag)
WHERE person <> otherPerson AND otherTag <> tag
RETURN
    otherTag.name AS tagName,
    COUNT(post) AS postCount
GROUP BY tagName
ORDER BY postCount DESC, tagName ASC
LIMIT 10
