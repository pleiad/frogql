# LDBC SNB Interactive Complex Read 1 — Transitive friends with a certain name.
# Spec: https://github.com/ldbc/ldbc_snb_docs/blob/main/query-specifications/interactive-complex-read-01.yaml

id = 1
name = "Transitive friends with a certain name"
status = "blocked"

blocked_reason = """
One gap remaining. Re-audited 2026-06-03 (post COLLECT_LIST / casted alias ordering):
  - GROUP BY by RETURN *alias* — the query groups by `friendId,
    friendLastName, distanceFromPerson, ...` (all RETURN aliases, not
    binding variables). The typechecker only groups by binding variable
    and rejects the alias with "Variable friendId not found in context".
    See iso-gql-gaps.md §2.12.

What's now fine:
  - `COLLECT_LIST(...)` — list aggregate landed (2026-06-03); `COLLECT`
    / `ARRAY_AGG` aliases too. Drops all-null records from empty OPTIONAL.
  - `MATCH path = ...` — named path patterns landed (2026-06-03), with
    `PATH_LENGTH(path)` / `ELEMENTS(path)` / `CARDINALITY(path)` and the
    non-standard `NODES(path)` translation helper. See §2.9.
  - `RECORD {k: v, ...}` — record constructor landed with the IC7 cluster.
  - `ANY SHORTEST (...)` — both the prefix and `path = ANY SHORTEST (...)`.
  - `WHERE p <> friend` — bare-node `<>` works since PR #42.
"""

required_features = [
    "GROUP BY by RETURN alias",
]

params_file = "interactive_1_param.txt"
param_columns = ["personId", "firstName"]
param_types = ["int", "string"]
query = """
MATCH (p:Person {id: $personId})
MATCH path = ANY SHORTEST (p)~[:knows]~{1, 3}(friend:Person {firstName: $firstName})
WHERE p <> friend
OPTIONAL MATCH (friend)-[studyAt:studyAt]->(uni:University)-[:isLocatedIn]->(uniCity:City)
OPTIONAL MATCH (friend)-[workAt:workAt]->(company:Company)-[:isLocatedIn]->(companyCountry:Country)
RETURN 
    friend.id AS friendId, 
    friend.lastName AS friendLastName, 
    PATH_LENGTH(path) AS distanceFromPerson,
    friend.birthday AS friendBirthday,
    friend.creationDate AS friendCreationDate,
    friend.gender AS friendGender,
    friend.browserUsed AS friendBrowserUsed,
    friend.locationIP AS friendLocationIp,
    friend.email AS friendEmails,
    friend.speaks AS friendLanguages,
    uniCity.name AS friendCityName,
    COLLECT_LIST(RECORD {uniName: uni.name, classYear: studyAt.classYear, uniCityName: uniCity.name}) AS friendUniversities,
    COLLECT_LIST(RECORD {companyName: company.name, workFrom: workAt.workFrom, companyCountryName: companyCountry.name}) AS friendCompanies
GROUP BY friendId, friendLastName, distanceFromPerson, friendBirthday, friendCreationDate, friendGender, friendBrowserUsed, friendLocationIp, friendEmails, friendLanguages, friendCityName
ORDER BY distanceFromPerson ASC, friendLastName ASC, CAST(friendId AS INTEGER) ASC
LIMIT 20
"""
