# LDBC SNB Interactive Complex Read 12 — Expert search.
# Spec: https://github.com/ldbc/ldbc_snb_docs/blob/main/query-specifications/interactive-complex-read-12.yaml

id = 12
name = "Expert search"
status = "blocked"

blocked_reason = """
Re-audited 2026-06-03 (post COLLECT_LIST). One real blocker:
  - GROUP BY / ORDER BY by RETURN *alias* — the query groups by
    `friendId, friendFirstName, friendLastName` (RETURN aliases, not
    binding variables) and orders by the alias `replyCount`. The
    typechecker only groups by binding variable and rejects the alias
    with "Variable friendId not found in context". See §2.12.

What's now fine:
  - `COLLECT_LIST(DISTINCT tag.name)` — list aggregate landed
    (2026-06-03); `COLLECT` / `ARRAY_AGG` aliases too. See §2.11.
  - `[:isSubclassOf]->{0,}` — unbounded repetition parses, and the
    typechecker admits it under a restrictive path-mode prefix. Since
    `isSubclassOf` is a DAG, wrap the operand as
    `ACYCLIC (...)-[:isSubclassOf]->{0,}(...)` — a translation
    divergence, no engine change. (Bare `{0,}` is still rejected by
    the typechecker as infinite under `WALK ALL`, which is correct.)
  - `COUNT(comment)` — bare-node aggregates work since PR #42.
"""

required_features = [
    "GROUP BY / ORDER BY by RETURN alias",
]

params_file = "interactive_12_param.txt"
param_columns = ["personId", "tagClassName"]
param_types = ["int", "string"]
query = """
MATCH (person:Person {id: $personId})~[:knows]~(friend:Person)<-[:hasCreator]-(comment:Comment)-[:replyOf]->(post:Post)-[:hasTag]->(tag:Tag)-[:hasType]->(tagClass:TagClass)-[:isSubclassOf]->{0,}(:TagClass {name: $tagClassName})
RETURN 
    friend.id AS friendId, 
    friend.firstName AS friendFirstName, 
    friend.lastName AS friendLastName, 
    COLLECT_LIST(DISTINCT tag.name) AS tagNames, 
    COUNT(comment) AS replyCount
GROUP BY friendId, friendFirstName, friendLastName
ORDER BY replyCount DESC, CAST(friendId AS INTEGER) ASC
LIMIT 20
"""
