# LDBC SNB Interactive Complex Read 12 — Expert search.
# Spec: https://github.com/ldbc/ldbc_snb_docs/blob/main/query-specifications/interactive-complex-read-12.yaml

id = 12
name = "Expert search"
status = "blocked"

blocked_reason = """
Tested 2026-05-05:
  - `COLLECT_LIST(DISTINCT tag.name)` — `COLLECT_LIST` aggregate not
    in parser. Tested also `collect`, `array_agg`, `ARRAY_AGG` —
    none recognized. No equivalent function exists today.
  - `COUNT(comment)` — bare-node aggregate; `COUNT(comment.id)` or
    `COUNT(*)` would parse.
  - `[:isSubclassOf]->{0,}` — zero-or-more reflexive transitive
    closure; could be supported via `{0,N}` for some N, but the
    open-ended {0,} form is the spec.
The COLLECT_LIST gap is the main blocker — the query's whole point
is to multiset-aggregate the tag names per friend.
"""

required_features = [
    "COLLECT_LIST / multiset aggregate (any name)",
    "COUNT over bare node references",
    "{0,} unbounded transitive closure (or {0,N} approximation)",
]

params_file = "interactive_12_param.txt"
param_columns = ["personId", "tagClassName"]
param_types = ["int", "string"]
query = """
MATCH (person:Person {id: $personId})~[:knows]~(friend:Person)<-[:hasCreator]-(comment:Comment)-[:replyOf]->(post:Post)-[:hasTag]->(tag:Tag)-[:hasType]->(tagClass:TagClass)-[:isSubclassOf]->{0,}(:TagClass {name: $tagClassName})
RETURN 
    friend.id AS friendId, 
    friend.firstName AS friendFirstName, 
    friend.lastName AS friendLastName, 
    COLLECT_LIST(DISTINCT tag.name) AS tagNames, 
    COUNT(comment) AS replyCount
GROUP BY friendId, friendFirstName, friendLastName
ORDER BY replyCount DESC, CAST(friendId AS INTEGER) ASC
LIMIT 20
"""
