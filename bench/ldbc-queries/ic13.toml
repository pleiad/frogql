# LDBC SNB Interactive Complex Read 13 — Single shortest path.
# Spec: https://github.com/ldbc/ldbc_snb_docs/blob/main/query-specifications/interactive-complex-read-13.yaml

id = 13
name = "Single shortest path"
status = "blocked"

blocked_reason = """
Re-audited 2026-06-03 after ISO §16.6 path prefix support:
  - `ANY SHORTEST (...)` is now supported for unnamed path patterns.
  - IC13 still writes `MATCH path = ANY SHORTEST (...)` and returns
    `PATH_LENGTH(path)`. froGQL does not yet bind named path values, so
    there is no `path` value for `PATH_LENGTH` to inspect.
Note: `CASE WHEN ... END` is now supported, but IC13 still cannot run
until named path patterns and path functions are implemented.
"""

required_features = [
    "named path patterns (MATCH path = ...)",
    "PATH_LENGTH path function",
]

params_file = "interactive_13_param.txt"
param_columns = ["person1Id", "person2Id"]
query = """
MATCH path = ANY SHORTEST (p1:Person {id: $person1Id})~[:knows]~*(p2:Person {id: $person2Id})
RETURN 
    CASE WHEN PATH_LENGTH(path) IS NULL THEN -1 ELSE PATH_LENGTH(path) END AS shortestPathLength
"""
