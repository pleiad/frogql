# LDBC SNB Interactive Complex Read 14 (v1) — Trusted connection paths.
# Spec: https://github.com/ldbc/ldbc_snb_docs/blob/main/query-specifications/interactive-complex-read-14-v1.yaml
# (v2 also exists; v1 is the spec referenced by `interactive-v1.tex`.)

id = 14
name = "Trusted connection paths (v1)"
status = "blocked"

blocked_reason = """
All shortest paths on `:knows` with interaction weights and aggregation along
paths - beyond single-pair shortest path; needs dedicated path algorithms + surface.
"""

required_features = [
    "all-shortest-paths",
    "weighted-path / path aggregation",
]

params_file = "interactive_14_param.txt"
param_columns = ["person1Id", "person2Id"]
query = """
MATCH path = ALL SHORTEST (p1:Person {id: $person1Id})~[:knows]~*(p2:Person {id: $person2Id})
RETURN 
    [n IN NODES(path) | n.id] AS personIdsInPath,
    SUM(
        VALUE {
            /* Case 1: Post replies */
            MATCH (pe1:Person)~[:knows]~(pe2:Person)
            WHERE pe1 IN NODES(path) AND pe2 IN NODES(path) AND pe1 <> pe2
            OPTIONAL MATCH (pe1)<-[:hasCreator]-(c:Comment)-[:replyOf]->(po:Post)-[:hasCreator]->(pe2)
            RETURN COUNT(c) * 1.0
        } + 
        VALUE {
            /* Case 2: Comment replies */
            MATCH (pe1:Person)~[:knows]~(pe2:Person)
            WHERE pe1 IN NODES(path) AND pe2 IN NODES(path) AND pe1 <> pe2
            OPTIONAL MATCH (pe1)<-[:hasCreator]-(c1:Comment)-[:replyOf]->(c2:Comment)-[:hasCreator]->(pe2)
            RETURN COUNT(c1) * 0.5
        }
    ) AS pathWeight
ORDER BY pathWeight DESC
"""
