# LDBC SNB Interactive Complex Read 14 (v1) — Trusted connection paths.
# Spec: https://github.com/ldbc/ldbc_snb_docs/blob/main/query-specifications/interactive-complex-read-14-v1.yaml
# (v2 also exists; v1 is the spec referenced by `interactive-v1.tex`.)

id = 14
name = "Trusted connection paths (v1)"
status = "blocked"

blocked_reason = """
Re-audited 2026-06-03 (post IC7 cluster). Remaining parser gaps:
  - `MATCH path = ALL SHORTEST (...)` — path naming (binding the
    pattern to `path`) missing. The `ALL SHORTEST` *prefix* already
    works; only the named-path form is absent. See iso-gql-gaps.md §2.9.
  - `[n IN NODES(path) | n.id]` — list comprehension `[x IN list | f(x)]`
    not in parser, and `NODES(path)` needs path naming first. See §2.10.

What's now fine:
  - `VALUE { ... }` — value subquery landed with the IC7 cluster
    (2026-06-03).
  - `COUNT(c) * 1.0`, `COUNT(c1) * 0.5` — multiplication `*` parses
    (the previous audit was wrong); division `/` also lands now.
  - `pe1 <> pe2` — bare-node `<>` works since PR #42.

Once named paths + path functions + list comprehension land, this IC
runs. See the IC roadmap in iso-gql-gaps.md.
"""

required_features = [
    "named path patterns (MATCH path = ...)",
    "PATH_LENGTH / NODES path functions",
    "list comprehension `[x IN list | expr]`",
]

params_file = "interactive_14_param.txt"
param_columns = ["person1Id", "person2Id"]
query = """
MATCH path = ALL SHORTEST (p1:Person {id: $person1Id})~[:knows]~*(p2:Person {id: $person2Id})
RETURN 
    [n IN NODES(path) | n.id] AS personIdsInPath,
    SUM(
        VALUE {
            /* Case 1: Post replies */
            MATCH (pe1:Person)~[:knows]~(pe2:Person)
            WHERE pe1 IN NODES(path) AND pe2 IN NODES(path) AND pe1 <> pe2
            OPTIONAL MATCH (pe1)<-[:hasCreator]-(c:Comment)-[:replyOf]->(po:Post)-[:hasCreator]->(pe2)
            RETURN COUNT(c) * 1.0
        } + 
        VALUE {
            /* Case 2: Comment replies */
            MATCH (pe1:Person)~[:knows]~(pe2:Person)
            WHERE pe1 IN NODES(path) AND pe2 IN NODES(path) AND pe1 <> pe2
            OPTIONAL MATCH (pe1)<-[:hasCreator]-(c1:Comment)-[:replyOf]->(c2:Comment)-[:hasCreator]->(pe2)
            RETURN COUNT(c1) * 0.5
        }
    ) AS pathWeight
ORDER BY pathWeight DESC
"""
