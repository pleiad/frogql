# LDBC SNB Interactive Complex Read 2 — Recent messages by your friends.
# Spec: https://github.com/ldbc/ldbc_snb_docs/blob/main/query-specifications/interactive-complex-read-02.yaml

id = 2
name = "Recent messages by your friends"
status = "implemented"

# Substitution params: relative to the substitution_parameters-sf0.1
# archive root. The bench resolves this against --params-dir.
params_file = "interactive_2_param.txt"

# Column names in the param file's header, in order.
# Used purely for documentation; the bench substitutes by position
# matching the {placeholder} order in the query template.
param_columns = ["personId", "maxDate"]

# Query template. {personId} and {maxDate} are placeholders the
# runner replaces with the param values from the file.
#
# `LIMIT 20` is the spec-faithful cap (LDBC IC2 spec: "LIMIT 20").
# Now that gqlite's parser accepts LIMIT, the cap lives in the query
# rather than via `bench_queries`'s `--limit` flag. The runtime
# combines both caps via `min`, so passing `--limit N` for a smaller
# ad-hoc budget still works without touching this file.
query = """
MATCH (p: Person {id: {personId}})~[:knows]~(friend: Person)<-[:hasCreator]-(c: Comment) \
    | (p: Person {id: {personId}})~[:knows]~(friend: Person)<-[:hasCreator]-(c: Post) \
WHERE c.creationDate <= {maxDate} \
RETURN friend.id, friend.firstName, friend.lastName, c.id, c.content, c.creationDate \
LIMIT 20
"""

# What the spec asks the query to return, in order. For documentation
# and possible future result-shape validation. Spec uses
# `coalesce(message.content, message.imageFile)` — we return c.content
# directly (see divergences below).
return_columns = [
    "friend.id", "friend.firstName", "friend.lastName",
    "c.id", "c.content", "c.creationDate",
]

[divergences]
no-coalesce  = "spec returns coalesce(message.content, message.imageFile); we return c.content"
no-order-by  = "spec ORDER BY message.creationDate DESC, message.id ASC; we don't sort"
edge-casing  = "spec uses [:KNOWS] / [:HAS_CREATOR]; loader gives [:knows] / [:hasCreator]"
message-union = "spec uses (message:Message) Cypher label inheritance; we use Comment | Post path-pattern alternation"
