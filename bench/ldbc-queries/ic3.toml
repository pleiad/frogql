# LDBC SNB Interactive Complex Read 3 — Friends and friends of friends that have been to given countries.
# Spec: https://github.com/ldbc/ldbc_snb_docs/blob/main/query-specifications/interactive-complex-read-03.yaml

id = 3
name = "Friends and friends of friends that have been to given countries"
status = "blocked"

blocked_reason = """
Tested 2026-05-05:
  - `WHERE person <> otherPerson` — bare-node comparison; gqlite needs
    property access (`person.id != otherPerson.id`). The `<>` token
    also doesn't tokenize standalone — use `!=`. With both rewrites
    this part would parse, but:
  - `COUNT(DISTINCT messageX)` — `DISTINCT` over a bare node reference
    not supported. `COUNT(DISTINCT messageX.id)` would parse.
  - `$startDate + DURATION({days: $durationDays})` — `DURATION` literal
    not in parser. Could be inlined as `$startDate + $durationDays * 86400000`,
    but `*` (multiplication) also doesn't tokenize. Would have to inline
    the resolved millis literal per param row in the substitution layer.
"""

required_features = [
    "bare-node comparison or property-access rewrite (`a.id != b.id`)",
    "`<>` operator (or rewrite to `!=`)",
    "DISTINCT over bare node references in aggregates",
    "DURATION literal (or inline the millis)",
    "multiplication operator `*`",
]

params_file = "interactive_3_param.txt"
param_columns = ["personId", "countryXName", "countryYName", "startDate", "endDate"]
param_types = ["int", "string", "string", "int", "int"]
query = """
MATCH (person:Person {id: $personId})~[:knows]~{1, 2}(otherPerson:Person)
WHERE person <> otherPerson
MATCH (otherPerson)-[:isLocatedIn]->(:City)-[:isPartOf]->(country:Country)
WHERE country.name <> $countryXName AND country.name <> $countryYName
MATCH (otherPerson)<-[:hasCreator]-(messageX:Message)-[:isLocatedIn]->(:Country {name: $countryXName})
WHERE messageX.creationDate >= $startDate AND messageX.creationDate < $startDate + DURATION({days: $durationDays})
MATCH (otherPerson)<-[:hasCreator]-(messageY:Message)-[:isLocatedIn]->(:Country {name: $countryYName})
WHERE messageY.creationDate >= $startDate AND messageY.creationDate < $startDate + DURATION({days: $durationDays})
RETURN 
    otherPerson.id AS otherPersonId,
    otherPerson.firstName AS otherPersonFirstName,
    otherPerson.lastName AS otherPersonLastName,
    COUNT(DISTINCT messageX) AS xCount,
    COUNT(DISTINCT messageY) AS yCount,
    COUNT(DISTINCT messageX) + COUNT(DISTINCT messageY) AS totalCount
GROUP BY otherPersonId, otherPersonFirstName, otherPersonLastName
ORDER BY totalCount DESC, CAST(otherPersonId AS INTEGER) ASC
LIMIT 20
"""
