# LDBC SNB Interactive Complex Read 4 — New topics.
# Spec: https://github.com/ldbc/ldbc_snb_docs/blob/main/query-specifications/interactive-complex-read-04.yaml

id = 4
name = "New topics"
status = "blocked"

blocked_reason = """
Re-audited 2026-05-06. Most of the query parses (NOT EXISTS works,
ORDER BY works, COUNT over bare nodes works post-PR-#42). What
remains:
  - `$startDate + DURATION({days: $durationDays})` — `DURATION`
    literal not in parser.
  - Inlining as `$startDate + $durationDays * 86400000` doesn't help
    because `*` (multiplication) doesn't tokenize either. Need
    substitution-time pre-computation of the millis offset (turn the
    second WHERE bound into a precomputed integer).
"""

required_features = [
    "DURATION literal (or substitution-time pre-computation)",
    "multiplication operator `*`",
]

params_file = "interactive_4_param.txt"
param_columns = ["personId", "startDate", "endDate"]
query = """
MATCH (person:Person {id: $personId})~[:knows]~(friend:Person)<-[:hasCreator]-(post:Post)-[:hasTag]->(tag:Tag)
WHERE post.creationDate >= $startDate AND post.creationDate < $startDate + DURATION({days: $durationDays})
  AND NOT EXISTS {
      MATCH (friend)<-[:hasCreator]-(post2:Post)-[:hasTag]->(tag)
      WHERE post2.creationDate < $startDate
  }
RETURN tag.name AS tagName, COUNT(post) AS postCount
GROUP BY tagName
ORDER BY postCount DESC, tagName ASC
LIMIT 10
"""
