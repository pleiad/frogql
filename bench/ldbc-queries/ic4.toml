# LDBC SNB Interactive Complex Read 4 — New topics.
# Spec: https://github.com/ldbc/ldbc_snb_docs/blob/main/query-specifications/interactive-complex-read-04.yaml

id = 4
name = "New topics"
status = "blocked"

blocked_reason = """
Anti-join: in-window friend posts with a tag, excluding tags that ever appeared on
any friend's post before the window. Ranked result: `ORDER BY`.
"""

required_features = [
    "graph NOT EXISTS / existential subquery",
    "ORDER BY",
]

params_file = "interactive_4_param.txt"
param_columns = ["personId", "startDate", "endDate"]
query = """
MATCH (person:Person {id: $personId})~[:KNOWS]~(friend:Person)<-[:HAS_CREATOR]-(post:Post)-[:HAS_TAG]->(tag:Tag)
WHERE post.creationDate >= $startDate AND post.creationDate < $startDate + DURATION({days: $durationDays})
  AND NOT EXISTS {
      MATCH (friend)<-[:HAS_CREATOR]-(post2:Post)-[:HAS_TAG]->(tag)
      WHERE post2.creationDate < $startDate
  }
RETURN tag.name AS tagName, COUNT(post) AS postCount
GROUP BY tagName
ORDER BY postCount DESC, tagName ASC
LIMIT 10
"""
