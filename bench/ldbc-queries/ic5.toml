# LDBC SNB Interactive Complex Read 5 — New groups.
# Spec: https://github.com/ldbc/ldbc_snb_docs/blob/main/query-specifications/interactive-complex-read-05.yaml

id = 5
name = "New groups"
status = "implemented"

params_file = "interactive_5_param.txt"
param_columns = ["personId", "minDate"]
param_types = ["int", "int"]

query = """
MATCH (person:Person {id: {personId}})~[:knows]~{1, 2}(otherPerson:Person)
WHERE person <> otherPerson
MATCH (otherPerson)<-[hm:hasMember]-(forum:Forum)
WHERE hm.creationDate > {minDate}
OPTIONAL MATCH (otherPerson)<-[:hasCreator]-(post:Post)<-[:containerOf]-(forum)
RETURN
    forum.title AS forumTitle,
    COUNT(post) AS postCount
GROUP BY forum.title, forum.id
ORDER BY postCount DESC, forum.id ASC
LIMIT 20
"""

return_columns = ["forumTitle", "postCount"]

expected_shape = "s,i"

[divergences]
no-cast = "spec ORDER BY tie-break is `CAST(forum.id AS INTEGER) ASC`. gqlite stores Forum.id as native int, so plain `forum.id ASC` sorts identically. CAST isn't in the parser; not needed here. Same divergence as IC8/IC9."
group-by-raw-expr = "spec writes `GROUP BY forumTitle, forum.id` referencing the RETURN-alias `forumTitle`. gqlite's parser doesn't visit RETURN aliases when resolving GROUP BY items, so we substitute `GROUP BY forum.title, forum.id` (raw expression). Same group key, same rows."
edge-casing = "loader produces lowercase :knows, :hasMember, :hasCreator, :containerOf. Loader-level."
bare-node-compare = "spec uses `WHERE person <> otherPerson`. gqlite's `<>` on bound nodes is now first-class (PR #42); we run the spec verbatim."
