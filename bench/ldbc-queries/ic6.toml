# LDBC SNB Interactive Complex Read 6 — Tag co-occurrence.
# Spec: https://github.com/ldbc/ldbc_snb_docs/blob/main/query-specifications/interactive-complex-read-06.yaml

id = 6
name = "Tag co-occurrence"
status = "blocked"

blocked_reason = """
Tested 2026-05-05:
  - `WHERE person <> otherPerson` — bare-node comparison; needs the
    `person.id != otherPerson.id` rewrite.
  - `WHERE otherTag.name <> $tagName` — `<>` doesn't tokenize; `!=`
    would parse (this one is property-comparison, no node-rewrite
    needed).
  - `COUNT(post)` — bare-node aggregate; needs `COUNT(post.id)` or
    `COUNT(*)`.
  - `GROUP BY otherTagName` — also failed in testing
    (`unexpected bare variable 'otherTagName'`); aliases from RETURN
    not visible in GROUP BY. Workaround: `GROUP BY otherTag.name`
    (raw expression instead of alias).
"""

required_features = [
    "bare-node comparison (or property-access rewrite)",
    "`<>` operator (or rewrite to `!=`)",
    "COUNT over bare node references",
    "GROUP BY by RETURN-clause alias",
]

params_file = "interactive_6_param.txt"
param_columns = ["personId", "tagName"]
param_types = ["int", "string"]
query = """
MATCH (person:Person {id: $personId})~[:knows]~{1, 2}(otherPerson:Person)
WHERE person <> otherPerson
MATCH (otherPerson)<-[:hasCreator]-(post:Post)-[:hasTag]->(:Tag {name: $tagName})
MATCH (post)-[:hasTag]->(otherTag:Tag)
WHERE otherTag.name <> $tagName
RETURN otherTag.name AS otherTagName, COUNT(post) AS postCount
GROUP BY otherTagName
ORDER BY postCount DESC, otherTagName ASC
LIMIT 10
"""
