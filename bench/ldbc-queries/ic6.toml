# LDBC SNB Interactive Complex Read 6 — Tag co-occurrence.
# Spec: https://github.com/ldbc/ldbc_snb_docs/blob/main/query-specifications/interactive-complex-read-06.yaml

id = 6
name = "Tag co-occurrence"
status = "implemented"

params_file = "interactive_6_param.txt"
param_columns = ["personId", "tagName"]
param_types = ["int", "string"]

query = """
MATCH (person:Person {id: {personId}})~[:knows]~{1, 2}(otherPerson:Person)
WHERE person <> otherPerson
MATCH (otherPerson)<-[:hasCreator]-(post:Post)-[:hasTag]->(:Tag {name: {tagName}})
MATCH (post)-[:hasTag]->(otherTag:Tag)
WHERE otherTag.name <> {tagName}
RETURN
    otherTag.name AS otherTagName,
    COUNT(post) AS postCount
GROUP BY otherTag.name
ORDER BY postCount DESC, otherTag.name ASC
LIMIT 10
"""

return_columns = ["otherTagName", "postCount"]

expected_shape = "s,i"

[divergences]
group-by-raw-expr = "spec writes `GROUP BY otherTagName` referencing the RETURN-alias. gqlite's parser doesn't visit RETURN aliases when resolving GROUP BY items, so we use `GROUP BY otherTag.name` (raw expression). Same group key, same rows. Same divergence as IC5."
order-by-raw-expr = "spec writes `ORDER BY postCount DESC, otherTagName ASC`. We keep `postCount` as the alias (alias resolution works for ORDER BY) but use `otherTag.name ASC` for the tie-break to match the GROUP BY rewrite. Identical sort key."
edge-casing = "loader produces lowercase :knows, :hasCreator, :hasTag. Loader-level."
bare-node-compare = "spec uses `WHERE person <> otherPerson`. gqlite's `<>` on bound nodes is now first-class (PR #42); we run the spec verbatim."
