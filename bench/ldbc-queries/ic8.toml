# LDBC SNB Interactive Complex Read 8 — Recent replies.
# Spec: https://github.com/ldbc/ldbc_snb_docs/blob/main/query-specifications/interactive-complex-read-08.yaml

id = 8
name = "Recent replies on a person's messages"
status = "implemented"

params_file = "interactive_8_param.txt"
param_columns = ["personId"]
param_types = ["int"]
query = """
MATCH (person:Person {id: $personId})<-[:hasCreator]-(message:Comment|Post)<-[:replyOf]-(comment:Comment)-[:hasCreator]->(commentAuthor:Person)
RETURN
    commentAuthor.id AS commentAuthorId,
    commentAuthor.firstName AS commentAuthorFirstName,
    commentAuthor.lastName AS commentAuthorLastName,
    comment.creationDate AS commentCreationDate,
    comment.id AS commentId,
    comment.content AS commentContent
ORDER BY commentCreationDate DESC, commentId ASC
LIMIT 20
"""

return_columns = [
    "commentAuthorId", "commentAuthorFirstName", "commentAuthorLastName",
    "commentCreationDate", "commentId", "commentContent",
]

expected_shape = "i,s,s,i,i,s"

[divergences]
message-union = "spec uses (message:Message); we use (message:Comment|Post). Same as IC2/IC7."
edge-casing = "loader produces lowercase :hasCreator / :replyOf. No semantic difference."
no-cast-int = "ORDER BY tie-break is `CAST(commentId AS INTEGER) ASC`. gqlite stores `Comment.id` as native int; plain `commentId ASC` is exact-equivalent."
