# LDBC SNB Interactive Complex Read 9 — Recent messages by friends or friends of friends.
# Spec: https://github.com/ldbc/ldbc_snb_docs/blob/main/query-specifications/interactive-complex-read-09.yaml

id = 9
name = "Recent messages by friends or friends of friends"
status = "implemented"

params_file = "interactive_9_param.txt"
param_columns = ["personId", "maxDate"]
param_types = ["int", "int"]

query = """
MATCH (person:Person {id: {personId}})~[:knows]~{1, 2}(otherPerson:Person)<-[:hasCreator]-(message:Comment|Post)
WHERE person <> otherPerson AND message.creationDate < {maxDate}
RETURN
    otherPerson.id AS personId,
    otherPerson.firstName AS personFirstName,
    otherPerson.lastName AS personLastName,
    message.id AS commentOrPostId,
    COALESCE(message.content, message.imageFile) AS commentOrPostContent,
    message.creationDate AS commentOrPostCreationDate
ORDER BY commentOrPostCreationDate DESC, commentOrPostId ASC
LIMIT 20
"""

return_columns = [
    "personId", "personFirstName", "personLastName",
    "commentOrPostId", "commentOrPostContent", "commentOrPostCreationDate",
]

[divergences]
message-union = "spec uses (message:Message); our LDBC loader doesn't synthesize a :Message superlabel, so we use the :Comment|Post ISO GQL alternation. Same logical query — same as IC2/IC8."
edge-casing = "loader produces lowercase :knows, :hasCreator. Loader-level."
no-cast = "spec ORDER BY tie-break is `CAST(commentOrPostId AS INTEGER) ASC`. gqlite stores LDBC IDs as native int, so plain `commentOrPostId ASC` sorts identically. CAST isn't in the parser; not needed here."
bare-node-compare = "spec uses `WHERE person <> otherPerson` (compares node references). gqlite's `<>` operator on bound nodes is now first-class (PR #42 — `tests/first_class_node_edge_values_test.rs`); we run the spec verbatim."
