[package]
name = "frogql-node"
version = "0.3.0"
edition = "2021"
publish = false

[lib]
# crate-type = ["cdylib"] only; no `name` override. napi-cli expects the
# cargo artifact to match the package name (frogql_node), then renames it
# to whatever `napi.binaryName` in package.json says (`frogql`).
crate-type = ["cdylib"]

[dependencies]
# Same default-features = false trick as `python/`: the wheel and the
# .node both ship only the library half of frogql (no rustyline / ureq /
# zstd / tar / sysinfo / toml). Resolver v2 at the workspace level keeps
# features per-target so cross-builds stay clean.
frogql_core = { package = "frogql", path = "..", default-features = false }
# napi 3.10+ is required: napi-derive 3.5's generated code references
# bindgen_prelude symbols (get_named_property_raw, ClassAccessorCallbackInfo,
# …) added after napi 3.8, so a looser `"3"` can resolve an incompatible
# 3.8.x runtime. The committed Cargo.lock pins the exact pair.
napi = { version = "3.10", default-features = false, features = ["napi6", "serde-json"] }
napi-derive = "3.5"
serde_json = "1"

[build-dependencies]
napi-build = "2"

# NOTE: workspace ignores non-root [profile.release], so per-crate LTO /
# strip settings would silently no-op. Release builds inherit the
# workspace default; CI can layer `RUSTFLAGS=-C strip=symbols` for wheels.
