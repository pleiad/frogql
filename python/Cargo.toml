[package]
name = "frogql-py"
version = "0.4.0"
edition = "2021"

[lib]
name = "frogql"
crate-type = ["cdylib"]

[dependencies]
# default-features = false drops REPL (rustyline) and bench (ureq, zstd,
# tar, sysinfo, toml) deps. The wheel only needs the library half of
# frogql. Keeps the cdylib small and avoids ring's aarch64 cross build
# issue on manylinux2014.
frogql_core = { package = "frogql", path = "..", default-features = false }
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py38"] }
