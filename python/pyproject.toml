[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "frogql"
version = "0.2.4"
description = "froGQL — embedded GQL graph database with ISO GQL path patterns (Rust core, Python bindings)"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [
    { name = "Matías Toro", email = "mtoro.cl@gmail.com" },
]
keywords = ["gql", "graph", "database", "query", "ltj", "leapfrog-triejoin", "iso-gql"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/pleiad/frogql"
Repository = "https://github.com/pleiad/frogql"
Issues = "https://github.com/pleiad/frogql/issues"

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "frogql"
features = ["pyo3/extension-module"]
