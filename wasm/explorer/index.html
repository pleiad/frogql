<!doctype html>
<meta charset="utf-8">
<title>froGQL explorer</title>
<style>
  :root {
    --bg: #fbfaf8; --panel: #fff; --ink: #1c1a17; --muted: #6b655c;
    --line: #e3ded6; --accent: #2f6f4f; --accent-soft: #e8f1eb;
    --warn: #8a4b2a; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17161a; --panel: #1f1e23; --ink: #eceaf0; --muted: #9a94a1;
      --line: #32303a; --accent: #6bbd90; --accent-soft: #23342b; --warn: #d69b72;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--ink);
         display: grid; grid-template-columns: 290px 1fr; height: 100vh; }
  aside { border-right: 1px solid var(--line); padding: 16px; overflow-y: auto; background: var(--panel); }
  main  { display: grid; grid-template-rows: auto auto 1fr; min-width: 0; min-height: 0; }
  h1 { font-size: 15px; margin: 0 0 14px; letter-spacing: .01em; }
  h1 span { color: var(--accent); }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted);
       margin: 18px 0 8px; font-weight: 600; }
  label.file { display: block; border: 1px dashed var(--line); border-radius: 7px; padding: 10px;
               cursor: pointer; margin-bottom: 8px; font-size: 13px; }
  label.file:hover { border-color: var(--accent); }
  label.file input { display: none; }
  label.file b { display: block; font-weight: 600; }
  label.file em { color: var(--muted); font-style: normal; font-size: 12px; }
  button { font: inherit; padding: 7px 13px; border-radius: 6px; border: 1px solid var(--line);
           background: var(--panel); color: var(--ink); cursor: pointer; }
  button.go { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:disabled { opacity: .45; cursor: default; }
  #stats { font: 12px/1.7 var(--mono); color: var(--muted); }
  #stats b { color: var(--ink); font-weight: 600; }
  .lbl { display: inline-block; font: 11px var(--mono); background: var(--accent-soft);
         color: var(--accent); border-radius: 4px; padding: 1px 6px; margin: 0 4px 4px 0; }
  .bar { display: flex; gap: 8px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .bar .grow { flex: 1; }
  textarea { width: 100%; font: 13px/1.5 var(--mono); padding: 12px 16px; border: 0;
             border-bottom: 1px solid var(--line); background: var(--panel); color: var(--ink);
             resize: vertical; min-height: 78px; }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
  .tabs { display: flex; gap: 4px; }
  .tabs button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  #out { overflow: auto; min-height: 0; position: relative; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 6px 12px; border-bottom: 1px solid var(--line);
           white-space: nowrap; max-width: 380px; overflow: hidden; text-overflow: ellipsis; }
  th { position: sticky; top: 0; background: var(--panel); font-size: 11px; text-transform: uppercase;
       letter-spacing: .07em; color: var(--muted); }
  td { font-family: var(--mono); font-size: 12px; }
  canvas { display: block; touch-action: none; }
  .msg { padding: 28px 16px; color: var(--muted); max-width: 560px; }
  .msg.err { color: var(--warn); font-family: var(--mono); font-size: 12px; white-space: pre-wrap; }
  .hint { color: var(--muted); font-size: 12px; }
  code { font: 12px var(--mono); background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; }

  /* Editor: a highlighted <pre> under a transparent <textarea>. The two
     share every metric, so the caret lands on the painted glyph. */
  .ed { position: relative; border-bottom: 1px solid var(--line); background: var(--panel); }
  .ed pre, .ed textarea {
    margin: 0; padding: 12px 16px; font: 13px/1.5 var(--mono);
    white-space: pre-wrap; word-break: break-word; border: 0;
  }
  .ed pre { position: absolute; inset: 0; pointer-events: none; overflow: hidden; color: var(--ink); }
  .ed textarea { position: relative; background: transparent; color: transparent;
                 caret-color: var(--ink); width: 100%; min-height: 76px; resize: vertical;
                 display: block; }
  .ed textarea::selection { background: rgba(120,160,140,.35); }
  .k  { color: var(--accent); font-weight: 600; }   /* keyword */
  .lb { color: #9a5b2a; }                           /* :Label */
  .st { color: #7a5aa8; }                           /* 'string' */
  .nu { color: #2f6f9f; }                           /* number */
  .cm { color: var(--muted); font-style: italic; }  /* -- comment */
  @media (prefers-color-scheme: dark) {
    .lb { color: #d9a06a; } .st { color: #c3a6ee; } .nu { color: #8dc3ea; }
  }

  /* Node inspector */
  #insp { position: absolute; right: 12px; top: 12px; width: 300px; max-height: calc(100% - 24px);
          overflow: auto; background: var(--panel); border: 1px solid var(--line);
          border-radius: 9px; padding: 12px 14px; box-shadow: 0 6px 24px rgba(0,0,0,.10); }
  #insp h3 { margin: 0 0 8px; font-size: 13px; }
  #insp .x { float: right; cursor: pointer; color: var(--muted); }
  #insp dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 10px;
             font: 12px var(--mono); }
  #insp dt { color: var(--muted); }
  #insp dd { margin: 0; word-break: break-word; }

  .subtabs { display: flex; gap: 4px; padding: 8px 16px; border-bottom: 1px solid var(--line); }
  .subtabs button { padding: 4px 10px; font-size: 12px; }
  .subtabs button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  pre.schematext { margin: 0; padding: 16px; font: 12px/1.7 var(--mono);
                   white-space: pre-wrap; color: var(--ink); }
</style>

<aside>
  <h1>fro<span>GQL</span> explorer</h1>

  <label class="file"><input type="file" id="gdb" accept=".gdb">
    <b id="gdbName">Elegir .gdb</b><em>la base de datos</em></label>
  <label class="file"><input type="file" id="ltj" accept=".ltj">
    <b id="ltjName">Elegir .ltj (opcional)</b><em>índice; si no, se reconstruye</em></label>

  <h2>Base</h2>
  <div id="stats">sin cargar</div>

  <h2>Etiquetas de nodo</h2>
  <div id="nodeLabels" class="hint">—</div>
  <h2>Etiquetas de arista</h2>
  <div id="edgeLabels" class="hint">—</div>
</aside>

<main>
  <div class="ed"><pre id="hl" aria-hidden="true"></pre><textarea id="q" spellcheck="false" placeholder="(n)-[e]->(m)"></textarea></div>
  <div class="bar">
    <button class="go" id="run" disabled>Ejecutar &nbsp;⌘↵</button>
    <span class="tabs">
      <button id="tabTable" class="on">Tabla</button>
      <button id="tabGraph">Grafo</button>
      <button id="tabSchema">Esquema</button>
    </span>
    <span class="grow"></span>
    <span id="status" class="hint"></span>
    <span class="hint" style="margin-left:12px">rueda: zoom · arrastrar: mover</span>
  </div>
  <div id="out"><div class="msg">Carga un <code>.gdb</code> para empezar.</div></div>
</main>

<script type="module">
const $ = (id) => document.getElementById(id);
let rows = null, view = "table", scene = null, schema = null, schemaText = "";
let schemaMode = "diagram";   // or "text" — the REPL's `.schema` output

// Past this the drawing stops being readable — it becomes a texture, and
// the point of the view is to see the shape of one answer.
const MAX_DRAW = 120;

// ---- the engine lives in a worker ------------------------------------------
const w = new Worker("./worker.js", { type: "module" });
w.onmessage = ({ data: m }) => {
  if (m.ev === "status") return say(m.text);
  if (m.ev === "error")  return fail(m.msg);
  if (m.ev === "opened") return opened(m);
  if (m.ev === "rows") {
    rows = m.rows;
    say(`${Array.isArray(rows) ? rows.length : 1} filas · ${m.ms} ms`);
    if (view === "schema") setView("table"); else render();
  }
};
w.onerror = (e) => fail(e.message || e);

async function pick(input, nameEl, which) {
  const f = input.files[0]; if (!f) return;
  $(nameEl).textContent = f.name;
  say("leyendo…");
  const buf = await f.arrayBuffer();
  w.postMessage({ op: "file", which, bytes: buf }, [buf]);   // transferred, not copied
}
$("gdb").onchange = () => pick($("gdb"), "gdbName", "gdb");
$("ltj").onchange = () => pick($("ltj"), "ltjName", "ltj");

function opened(m) {
  schema = m.graph_json; schemaText = m.graph_type;
  $("stats").innerHTML =
    `<b>${m.node_count.toLocaleString()}</b> nodos<br>` +
    `<b>${m.edge_count.toLocaleString()}</b> aristas<br>` +
    `abierta en <b>${m.ms} ms</b>`;
  $("nodeLabels").innerHTML = chips(m.node_labels);
  $("edgeLabels").innerHTML = chips(m.edge_labels);
  $("run").disabled = false;
  if (!$("q").value) {
    $("q").value = m.node_labels.length
      ? `(n:${m.node_labels[0]})-[e]->(m) LIMIT 30` : `(n)-[e]->(m) LIMIT 30`;
    paint();
  }
  say(`lista (${m.ms} ms)`);
  setView("schema");   // the first thing anyone needs is what is in here
}
const chips = (xs) => xs.length
  ? xs.map((l) => `<span class="lbl">${esc(l)}</span>`).join("") : "—";

// ---- editor highlighting ---------------------------------------------------
// A transparent textarea over a painted <pre>. No library: the grammar
// worth colouring here is six token classes, and a dependency would cost
// more than it saves in a page that is meant to be copied around.
const KW = /\b(MATCH|OPTIONAL|RETURN|DISTINCT|WHERE|LIMIT|ORDER|BY|GROUP|ASC|DESC|AS|AND|OR|NOT|IS|NULL|TRUE|FALSE|INSERT|SET|REMOVE|DELETE|DETACH|NODETACH|COUNT|SUM|AVG|MIN|MAX|COLLECT_LIST|EXISTS|VALUE|RECORD|SHORTEST|TRAIL|SIMPLE|ACYCLIC|WALK|ALL|ANY|NEAREST|TO|ROWS|CAST|FLOOR|ELEMENTS|NODES|EDGES|PATH_LENGTH|CARDINALITY|DATE|LOCAL_DATETIME|IN)\b/gi;

function paint() {
  const src = $("q").value;
  let out = "", i = 0;
  // One pass, longest-match-first: comments, strings, labels, numbers,
  // keywords. Order matters — a keyword inside a string is not one.
  const rules = [
    [/--[^\n]*/y, "cm"],
    [/'(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*"/y, "st"],
    [/:[A-Za-z_][A-Za-z0-9_]*/y, "lb"],
    [/\d+(?:\.\d+)?/y, "nu"],
    [KW, "k"],
  ];
  while (i < src.length) {
    let hit = null;
    for (const [re, cls] of rules) {
      re.lastIndex = i;
      const m = re.exec(src);
      if (m && m.index === i) { hit = [m[0], cls]; break; }
    }
    if (hit) { out += `<span class="${hit[1]}">${esc(hit[0])}</span>`; i += hit[0].length; }
    else { out += esc(src[i]); i++; }
  }
  $("hl").innerHTML = out + "\n";
}
$("q").addEventListener("input", paint);
$("q").addEventListener("scroll", () => { $("hl").scrollTop = $("q").scrollTop; });

// ---- running ---------------------------------------------------------------
$("run").onclick = run;
$("q").onkeydown = (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); run(); }
};
function run() {
  const q = $("q").value.trim(); if (!q) return;
  w.postMessage({ op: "query", q, limit: 500 });
}

for (const [id, v] of [["tabTable","table"],["tabGraph","graph"],["tabSchema","schema"]])
  $(id).onclick = () => setView(v);
function setView(v) {
  view = v;
  $("tabTable").classList.toggle("on", v === "table");
  $("tabGraph").classList.toggle("on", v === "graph");
  $("tabSchema").classList.toggle("on", v === "schema");
  render();
}

function render() {
  if (view === "schema") return drawSchema();
  if (rows == null) return msg("Escribe un patrón y ejecuta.");
  if (!Array.isArray(rows)) return table([rows]);      // a DML counters object
  if (rows.length === 0) return msg("0 filas.");
  view === "graph" ? drawGraph(rows) : table(rows);
}

// ---- table -----------------------------------------------------------------
function table(rs) {
  scene = null;
  const cols = [...new Set(rs.flatMap((r) => Object.keys(r)))].filter((c) => c !== "_paths");
  const head = cols.map((c) => `<th>${esc(c)}</th>`).join("");
  const body = rs.map((r) =>
    "<tr>" + cols.map((c) => `<td>${esc(cell(r[c]))}</td>`).join("") + "</tr>").join("");
  $("out").innerHTML = `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}
function cell(v) {
  if (v == null) return "null";
  if (typeof v !== "object") return String(v);
  if (v.kind === "node" || v.kind === "edge") return elemLabel(v);
  return JSON.stringify(v);
}
// An element renders as its labels plus its first couple of properties;
// its internal id is deliberately not shown — it does not survive a save,
// so it is never the thing a reader wants.
function elemLabel(e) {
  const l = (e.labels || []).join("&") || e.kind;
  const p = e.props || {};
  const k = Object.keys(p).slice(0, 2).map((k) => `${k}: ${p[k]}`).join(", ");
  return k ? `${l} {${k}}` : l;
}

// ---- schema diagram --------------------------------------------------------
// A schema is a graph, and a text listing makes you rebuild its shape in
// your head. Boxes with a header and a property section, joined by
// labelled arrows — the shape the LDBC schema figure uses, because it is
// the one that reads.
const HUES = [205, 145, 35, 275, 0, 95, 320, 250, 60, 175];
function drawSchema() {
  if (!schema) return msg("Carga un <code>.gdb</code> para ver su esquema.");
  const out = $("out");
  // The two readings of the same thing. The drawing shows the shape; the
  // text is what `.schema` prints in the REPL, and is the one to copy
  // into a CREATE GRAPH TYPE or paste into a report.
  out.innerHTML = `<div class="subtabs">
      <button id="smDia" class="${schemaMode === "diagram" ? "on" : ""}">Diagrama</button>
      <button id="smTxt" class="${schemaMode === "text" ? "on" : ""}">Texto</button>
    </div>`;
  const bar = out.firstElementChild;
  $("smDia").onclick = () => { schemaMode = "diagram"; drawSchema(); };
  $("smTxt").onclick = () => { schemaMode = "text"; drawSchema(); };

  if (schemaMode === "text") {
    scene = null;
    const pre = document.createElement("pre");
    pre.className = "schematext";
    pre.textContent = schemaText || "(sin esquema)";
    out.appendChild(pre);
    return;
  }

  const types = (schema.nodes || []).filter((n) => n.name);
  if (!types.length) {
    const d = document.createElement("div");
    d.className = "msg";
    d.innerHTML = "Este esquema no nombra tipos de nodo; mira la pestaña <b>Texto</b>.";
    out.appendChild(d);
    return;
  }
  const cv = document.createElement("canvas");
  out.appendChild(cv);

  const W = out.clientWidth, H = out.clientHeight - bar.offsetHeight;
  const dpr = devicePixelRatio || 1;
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.width = W + "px"; cv.style.height = H + "px";
  const g = cv.getContext("2d");

  // Size each box from its own contents, so nothing is clipped and a
  // type with two properties does not get the footprint of one with ten.
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const boxes = types.map((t, i) => {
    g.font = "600 12px system-ui, sans-serif";
    let wd = g.measureText(t.name).width;
    g.font = "11px ui-monospace, monospace";
    const lines = t.props.map((p) => `${p.key}: ${p.type}`);
    for (const l of lines) wd = Math.max(wd, g.measureText(l).width);
    return { ...t, lines, hue: HUES[i % HUES.length],
             w: Math.ceil(wd) + 22, h: 26 + lines.length * 15 + (lines.length ? 8 : 4),
             x: 0, y: 0, vx: 0, vy: 0 };
  });
  const byName = new Map(boxes.map((b) => [b.name, b]));
  const links = (schema.edges || [])
    .filter((e) => e.label && byName.has(e.from) && byName.has(e.to))
    .map((e) => ({ ...e, a: byName.get(e.from), b: byName.get(e.to) }));

  const cols = Math.ceil(Math.sqrt(boxes.length));
  boxes.forEach((b, i) => {
    b.x = 60 + (i % cols) * (W - 140) / Math.max(1, cols - 1 || 1);
    b.y = 60 + Math.floor(i / cols) * 150;
  });

  scene = { kind: "schema", g, cv, boxes, links, W, H, dpr, k: 1, ox: 0, oy: 0, held: null };
  window.__s = scene;
  bindPointer(scene, () => boxes);

  let step = 0;
  const tick = () => {
    if (scene !== window.__s) return;
    // Repel by bounding box, not by centre: these are rectangles, and
    // treating them as points overlaps the wide ones.
    for (let i = 0; i < boxes.length; i++) {
      const a = boxes[i]; if (a === scene.held) continue;
      for (let j = i + 1; j < boxes.length; j++) {
        const b = boxes[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const ox = (a.w + b.w) / 2 + 40 - Math.abs(dx);
        const oy = (a.h + b.h) / 2 + 34 - Math.abs(dy);
        if (ox > 0 && oy > 0) {
          const push = Math.min(ox, oy) * 0.06;
          const sx = Math.sign(dx) || 1, sy = Math.sign(dy) || 1;
          if (ox < oy) { a.vx += sx * push; b.vx -= sx * push; }
          else         { a.vy += sy * push; b.vy -= sy * push; }
        }
      }
      a.vx += (W / 2 - a.x) * 0.002;
      a.vy += (H / 2 - a.y) * 0.002;
    }
    for (const l of links) {
      if (l.a === l.b) continue;
      const dx = l.b.x - l.a.x, dy = l.b.y - l.a.y;
      const d = Math.hypot(dx, dy) || 1, f = (d - 240) * 0.006;
      if (l.a !== scene.held) { l.a.vx += (dx / d) * f; l.a.vy += (dy / d) * f; }
      if (l.b !== scene.held) { l.b.vx -= (dx / d) * f; l.b.vy -= (dy / d) * f; }
    }
    for (const b of boxes) {
      if (b === scene.held) { b.vx = b.vy = 0; continue; }
      b.vx *= 0.8; b.vy *= 0.8; b.x += b.vx; b.y += b.vy;
    }
    paintSchema(scene);
    if (++step < 300 || scene.held) requestAnimationFrame(tick);
  };
  tick();
}

function paintSchema(s) {
  const { g, boxes, links, W, H, dpr, k, ox, oy } = s;
  const css = getComputedStyle(document.body);
  const ink = css.color, panel = css.getPropertyValue("--panel") || "#fff";
  const line = css.getPropertyValue("--line") || "#ddd";
  const muted = css.getPropertyValue("--muted") || "#888";
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;

  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);
  g.setTransform(dpr * k, 0, 0, dpr * k, dpr * ox, dpr * oy);
  g.lineWidth = 1 / k;

  // Lines first, boxes second, labels last. A label placed at the
  // midpoint of a line can land behind a third box, and drawing it before
  // the boxes clipped it to a few letters — which is worse than an
  // overlap, because a clipped name is unreadable while an overlapping
  // one is merely crowded.
  const captions = [];
  for (const l of links) {
    if (l.a === l.b) { selfLoop(g, l, ink, muted, k); continue; }
    const [x1, y1] = edgePoint(l.a, l.b), [x2, y2] = edgePoint(l.b, l.a);
    g.strokeStyle = muted;
    g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
    if (l.directed) arrow(g, x1, y1, x2, y2, muted, k);
    captions.push([l.label, (x1 + x2) / 2, (y1 + y2) / 2]);
  }

  for (const b of boxes) {
    const x = b.x - b.w / 2, y = b.y - b.h / 2;
    const fill = dark ? `hsl(${b.hue} 32% 26%)` : `hsl(${b.hue} 62% 86%)`;
    g.fillStyle = panel; g.strokeStyle = b === s.held ? ink : line;
    round(g, x, y, b.w, b.h, 6 / k); g.fill(); g.stroke();
    // Header section, then the properties under a rule — the two-part
    // box the LDBC figure uses.
    g.save(); round(g, x, y, b.w, b.h, 6 / k); g.clip();
    g.fillStyle = fill; g.fillRect(x, y, b.w, 22);
    g.restore();
    g.strokeStyle = line; g.beginPath();
    g.moveTo(x, y + 22); g.lineTo(x + b.w, y + 22); g.stroke();
    g.fillStyle = ink; g.textAlign = "center"; g.textBaseline = "middle";
    g.font = "600 12px system-ui, sans-serif";
    g.fillText(b.labels.join("&") || b.name, b.x, y + 11);
    g.textAlign = "left"; g.font = "11px ui-monospace, monospace";
    b.lines.forEach((l, i) => {
      g.fillStyle = ink;
      g.fillText(l, x + 10, y + 34 + i * 15);
    });
  }

  g.font = `${10 / k}px ui-monospace, monospace`;
  g.textAlign = "center"; g.textBaseline = "middle";
  for (const [text, mx, my] of captions) {
    const tw = g.measureText(text).width;
    g.fillStyle = panel;
    g.fillRect(mx - tw / 2 - 3 / k, my - 7 / k, tw + 6 / k, 14 / k);
    g.strokeStyle = line; g.lineWidth = 1 / k;
    g.strokeRect(mx - tw / 2 - 3 / k, my - 7 / k, tw + 6 / k, 14 / k);
    g.fillStyle = ink; g.fillText(text, mx, my);
  }
}

// Where the line from `a` towards `b` leaves a's rectangle.
function edgePoint(a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const hw = a.w / 2 + 2, hh = a.h / 2 + 2;
  const t = Math.min(dx ? hw / Math.abs(dx) : 1e9, dy ? hh / Math.abs(dy) : 1e9);
  return [a.x + dx * t, a.y + dy * t];
}
function arrow(g, x1, y1, x2, y2, col, k) {
  const an = Math.atan2(y2 - y1, x2 - x1), s = 7 / k;
  g.fillStyle = col; g.beginPath();
  g.moveTo(x2, y2);
  g.lineTo(x2 - s * Math.cos(an - .4), y2 - s * Math.sin(an - .4));
  g.lineTo(x2 - s * Math.cos(an + .4), y2 - s * Math.sin(an + .4));
  g.closePath(); g.fill();
}
// A relationship from a type to itself — `knows` on Person in the LDBC
// figure — is a loop off the right edge rather than a zero-length line.
function selfLoop(g, l, ink, muted, k) {
  const b = l.a, x = b.x + b.w / 2, y = b.y;
  g.strokeStyle = muted; g.beginPath();
  g.arc(x + 22, y, 22, Math.PI * 0.75, Math.PI * 1.25, true); g.stroke();
  if (l.directed) arrow(g, x + 30, y - 14, x + 2, y - 6, muted, k);
  g.fillStyle = ink; g.textAlign = "left"; g.textBaseline = "middle";
  g.font = `${10 / k}px ui-monospace, monospace`;
  g.fillText(l.label, x + 48, y);
}
function round(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r); g.closePath();
}

// ---- result graph ----------------------------------------------------------
function drawGraph(rs) {
  const N = new Map(), E = [];
  let clipped = false;
  for (const r of rs) {
    if (!r._paths) continue;
    for (const path of r._paths) {
      let prev = null, pending = null;
      for (const el of path) {
        if (el == null) continue;
        if (el.kind === "node") {
          if (!N.has(el.id)) {
            if (N.size >= MAX_DRAW) { clipped = true; prev = null; continue; }
            // The whole element is kept, not just its caption: clicking a
            // node has to show every label and every property, and asking
            // the engine again for something already in hand would be a
            // round trip for nothing.
            N.set(el.id, { id: el.id, el, t: elemLabel(el), x: 0, y: 0, vx: 0, vy: 0 });
          }
          if (prev != null && pending != null && N.has(prev)) E.push({ a: prev, b: el.id });
          prev = el.id; pending = null;
        } else if (el.kind === "edge") pending = el;
      }
    }
  }
  if (N.size === 0) {
    return msg(`Nada que dibujar.<br><br>El grafo se arma con los elementos que el patrón
      recorre. Una consulta con <code>RETURN</code> devuelve columnas, no elementos —
      quita el <code>RETURN</code> para verla dibujada.`);
  }
  const out = $("out");
  out.innerHTML = clipped
    ? `<div class="msg" id="clip" style="padding:8px 16px">Dibujando ${MAX_DRAW} de los nodos
       que el patrón tocó. Más que eso deja de leerse: acota con
       <code>LIMIT</code> o con una etiqueta más específica.</div>` : "";
  const taken = clipped ? $("clip").offsetHeight : 0;
  const cv = document.createElement("canvas");
  out.appendChild(cv);
  layout([...N.values()], E, cv, taken);
}

function layout(nodes, edges, cv, taken) {
  const W = cv.parentElement.clientWidth;
  const H = cv.parentElement.clientHeight - taken - 4;
  const dpr = devicePixelRatio || 1;
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.width = W + "px"; cv.style.height = H + "px";
  const g = cv.getContext("2d");
  const idx = new Map(nodes.map((n, i) => [n.id, i]));
  nodes.forEach((n) => { n.x = W / 2 + (Math.random() - .5) * W * .7;
                         n.y = H / 2 + (Math.random() - .5) * H * .7; });

  scene = { kind: "rows", g, cv, nodes, edges, idx, W, H, dpr, k: 1, ox: 0, oy: 0, held: null };
  window.__s = scene;
  bindPointer(scene, () => nodes);

  let step = 0;
  const tick = () => {
    if (scene !== window.__s) return;
    for (let i = 0; i < nodes.length; i++) {
      const a = nodes[i]; if (a === scene.held) continue;
      for (let j = i + 1; j < nodes.length; j++) {
        const b = nodes[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const d2 = dx * dx + dy * dy || 0.01, d = Math.sqrt(d2), f = 900 / d2;
        a.vx += (dx / d) * f; a.vy += (dy / d) * f;
        b.vx -= (dx / d) * f; b.vy -= (dy / d) * f;
      }
      a.vx += (W / 2 - a.x) * 0.0015; a.vy += (H / 2 - a.y) * 0.0015;
    }
    for (const e of edges) {
      const a = nodes[idx.get(e.a)], b = nodes[idx.get(e.b)];
      if (!a || !b) continue;
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.hypot(dx, dy) || 0.01, f = (d - 90) * 0.01;
      a.vx += (dx / d) * f; a.vy += (dy / d) * f;
      b.vx -= (dx / d) * f; b.vy -= (dy / d) * f;
    }
    for (const n of nodes) {
      if (n === scene.held) { n.vx = n.vy = 0; continue; }
      n.vx *= 0.82; n.vy *= 0.82; n.x += n.vx; n.y += n.vy;
    }
    paintRows(scene);
    if (++step < 320 || scene.held) requestAnimationFrame(tick);
  };
  tick();
}

function paintRows(s) {
  const { g, nodes, edges, idx, W, H, dpr, k, ox, oy } = s;
  const css = getComputedStyle(document.body);
  const ink = css.color;
  const line = css.getPropertyValue("--line") || "#ddd";
  const accent = css.getPropertyValue("--accent") || "#2f6f4f";
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);
  g.setTransform(dpr * k, 0, 0, dpr * k, dpr * ox, dpr * oy);
  g.strokeStyle = line; g.lineWidth = 1 / k;
  for (const e of edges) {
    const a = nodes[idx.get(e.a)], b = nodes[idx.get(e.b)];
    if (!a || !b) continue;
    g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke();
  }
  g.font = `${11 / k}px ui-monospace, monospace`;
  g.textAlign = "center"; g.textBaseline = "alphabetic";
  for (const n of nodes) {
    g.beginPath(); g.arc(n.x, n.y, 5 / k, 0, 7);
    g.fillStyle = n === s.held || n === s.sel ? ink : accent; g.fill();
    if (nodes.length <= 120 || k > 1.6) {
      g.fillStyle = ink; g.fillText(n.t.slice(0, 26), n.x, n.y - 10 / k);
    }
  }
}

// ---- pointer: zoom, pan, drag, inspect -------------------------------------
function bindPointer(s, items) {
  const { cv } = s;
  const at = (ev) => {
    const r = cv.getBoundingClientRect();
    return { x: (ev.clientX - r.left - s.ox) / s.k, y: (ev.clientY - r.top - s.oy) / s.k };
  };
  const hit = (p) => items().find((n) => n.w
    ? Math.abs(n.x - p.x) < n.w / 2 && Math.abs(n.y - p.y) < n.h / 2
    : Math.hypot(n.x - p.x, n.y - p.y) < 10 / s.k);

  cv.onwheel = (ev) => {
    ev.preventDefault();
    const r = cv.getBoundingClientRect();
    const mx = ev.clientX - r.left, my = ev.clientY - r.top;
    const k = Math.max(0.15, Math.min(6, s.k * Math.exp(-ev.deltaY * 0.0015)));
    s.ox = mx - ((mx - s.ox) / s.k) * k;      // hold the point under the cursor
    s.oy = my - ((my - s.oy) / s.k) * k;
    s.k = k; repaint(s);
  };

  let pan = null, moved = false;
  cv.onpointerdown = (ev) => {
    cv.setPointerCapture(ev.pointerId);
    moved = false;
    const n = hit(at(ev));
    if (n) { s.held = n; keepPainting(s); }
    else pan = { x: ev.clientX - s.ox, y: ev.clientY - s.oy };
  };
  cv.onpointermove = (ev) => {
    if (s.held) { const p = at(ev); s.held.x = p.x; s.held.y = p.y; moved = true; repaint(s); }
    else if (pan) { s.ox = ev.clientX - pan.x; s.oy = ev.clientY - pan.y; moved = true; repaint(s); }
    else cv.style.cursor = hit(at(ev)) ? "grab" : "default";
  };
  const up = (ev) => {
    // A click, not a drag, opens the inspector. Distinguishing them by
    // "did anything move" is what lets one gesture do both.
    if (!moved) {
      const n = hit(at(ev));
      n && n.el ? inspect(n, s) : closeInspector();
    }
    s.held = null; pan = null;
  };
  cv.onpointerup = up;
  cv.onpointercancel = () => { s.held = null; pan = null; };
}
const repaint = (s) => (s.kind === "schema" ? paintSchema(s) : paintRows(s));
function keepPainting(s) {
  const again = () => { if (s.held) { repaint(s); requestAnimationFrame(again); } };
  requestAnimationFrame(again);
}

// ---- node inspector --------------------------------------------------------
function inspect(n, s) {
  s.sel = n;
  const e = n.el, p = e.props || {};
  const keys = Object.keys(p).sort();
  closeInspector();
  const card = document.createElement("div");
  card.id = "insp";
  card.innerHTML =
    `<span class="x" id="inspX">×</span><h3>${esc((e.labels || []).join(" & ") || e.kind)}</h3>` +
    (keys.length
      ? `<dl>${keys.map((k) => `<dt>${esc(k)}</dt><dd>${esc(fmt(p[k]))}</dd>`).join("")}</dl>`
      : `<div class="hint">sin propiedades</div>`);
  $("out").appendChild(card);
  $("inspX").onclick = closeInspector;
  repaint(s);
}
const fmt = (v) => (v === null ? "null" : typeof v === "object" ? JSON.stringify(v) : String(v));
function closeInspector() {
  const c = $("insp"); if (c) c.remove();
  if (scene) scene.sel = null;
}

// ---- plumbing --------------------------------------------------------------
const say = (t) => { $("status").textContent = t; };
const msg = (h) => { scene = null; $("out").innerHTML = `<div class="msg">${h}</div>`; };
function fail(e) {
  say("error");
  $("out").innerHTML = `<div class="msg err">${esc(e)}</div>`;
}
function esc(s) {
  return String(s).replace(/[&<>"]/g,
    (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
paint();
</script>
